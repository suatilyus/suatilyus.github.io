<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>suatilyus AR</title>
<meta name="theme-color" content="#111">
<link rel="icon" href="../img/icon-192.png">
<link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
<style>
@font-face{font-family:"suat-skinny";src:url(../dosyalar/suatilyus-skinny-regular.ttf) format("truetype");font-display:swap}
@font-face{font-family:"suat-hand";src:url(../dosyalar/suatilyus-hand-regular.ttf) format("truetype");font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#111;color:#fff;font-family:"suat-hand","Patrick Hand",system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#ar{position:fixed;inset:0;touch-action:none}
#ar video{object-fit:cover}
.kat{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;background:#fff;color:#111;gap:14px}
.kat[hidden]{display:none}
.kat .amb{width:52vw;max-width:260px}
#giris{justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:calc(env(safe-area-inset-top) + 18px);padding-bottom:40px}
.cz{position:relative;display:block}.cz>img{display:block;width:100%;height:auto}.cz>img.c{position:absolute;inset:0;height:100%}
.ar-banner{width:86vw;max-width:440px;height:auto}.ar-yazi{width:76vw;max-width:380px;height:auto}
.ar-baloncuk{width:52vw;max-width:260px;height:auto;margin-top:6px}
.alt-geri{display:block;width:30vw;max-width:150px;margin-top:10px}.alt-geri img{width:100%;height:auto;display:block}
.kat h1{font-family:"suat-skinny",sans-serif;font-weight:400;font-size:13vw;max-width:520px;margin:0;line-height:1;letter-spacing:.02em}
.kat p{margin:0;font-size:5vw;max-width:420px;line-height:1.25}
.basla{font-family:"suat-skinny",sans-serif;font-size:9vw;max-width:100%;line-height:1;border:4px solid #111;border-radius:99px;padding:12px 34px;background:#e93e5e;color:#fff;box-shadow:4px 4px 0 #111;cursor:pointer}
.basla:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #111}
.hedefler{display:flex;gap:10px;justify-content:center}
.hedefler{flex-wrap:wrap}.hedefler a{display:flex;align-items:center;width:19vw;max-width:110px;border:3px solid #111;border-radius:10px;overflow:hidden;background:#fff}
.hedefler img{width:100%;display:block}
.kucuk{font-size:3.8vw!important;color:#666}
.geri{font-family:"suat-skinny",sans-serif;color:#111;font-size:5vw;text-decoration:underline}
@media(min-width:600px){.kat h1{font-size:64px}.kat p{font-size:22px}.basla{font-size:40px}.kucuk{font-size:16px!important}.geri{font-size:22px}}
/* camera UI */
.ust{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;pointer-events:none}
.ust>*{pointer-events:auto}
.dugme{font-family:"suat-skinny",sans-serif;font-size:20px;border:3px solid #111;border-radius:99px;padding:6px 14px;background:#fff;color:#111;box-shadow:3px 3px 0 #111;text-decoration:none;cursor:pointer}
.dugme[hidden]{display:none}
.ipucu{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translateX(-50%);z-index:5;background:#fff;color:#111;border:3px solid #111;border-radius:16px;padding:8px 16px;font-size:18px;box-shadow:3px 3px 0 #111;white-space:nowrap;transition:opacity .3s}
.ipucu.gizli{opacity:0}
.cerceve{position:fixed;left:50%;top:50%;width:62vw;height:62vw;max-width:340px;max-height:340px;transform:translate(-50%,-55%);z-index:4;pointer-events:none;transition:opacity .3s}
.cerceve i{position:absolute;width:22%;height:22%;border:4px solid #fff;filter:drop-shadow(0 0 2px #000)}
.cerceve i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.cerceve i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 14px 0 0}
.cerceve i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 14px}
.cerceve i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 14px 0}
.cerceve.gizli{opacity:0}
</style>
<script>
/* eski kopya koruması (ortak.js'deki gibi): tarayıcı bu sayfanın eski halini tuttuysa bir kere yenile.
   SURUM her güncellemede surum.txt ile aynı değere çekilir. */
window.SURUM = '2611200506';
fetch('../surum.txt?t=' + Date.now(), {cache: 'no-store'}).then(r => r.ok ? r.text() : '').then(t => {
  t = t.trim(); if (!t || t === window.SURUM) return;
  let son = 0; try { son = +sessionStorage.getItem('suat-yenile') || 0; } catch (e) {}
  if (Date.now() - son < 60000) return;            // never loop
  try { sessionStorage.setItem('suat-yenile', Date.now()); } catch (e) {}
  location.reload();
}).catch(() => {});
</script>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "mindar-image-three":"https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
}}
</script>
</head>
<body>
<div id="ar"></div>

<div class="kat" id="giris">
  <a class="amb cz" href="../" aria-label="Ana sayfa"><img class="c" src="../img/ui/amblem-c.png" alt=""><img src="../img/ui/amblem.png" alt="suatilyus — ana sayfa"></a>
  <img class="ar-banner" src="../img/ui/ar-banner.png" alt="suatilyus iftiharla sunar moruk" width="1100" height="238">
  <img class="ar-yazi" src="../img/ui/ar-yazi.png" alt="Bazı basılı işleri canlandırır…" width="1000" height="224">
  <p class="kucuk">Başla'ya bas, kameraya izin ver, telefonu çizime tut.</p>
  <p class="kucuk" id="izinNot" hidden>Safari her seferinde kamera izni sormasın diye: adres çubuğundaki <b>aA</b> → Web Sitesi Ayarları → Kamera → <b>İzin Ver</b>.</p>
  <button class="basla" id="basla" type="button">BAŞLA</button>
  <img class="ar-baloncuk" src="../img/ui/ar-baloncuk.png" alt="Alttaki çizimlerden elinde yoksa üstüne tıkla, başka telefonla canlandır" width="700" height="578">
  <div class="hedefler">
    <a data-ad="pixel" href="hedef/pixel.jpg" target="_blank" rel="noopener"><img src="hedef/pixel.jpg" alt="Çizim 1"></a>
    <a data-ad="gece" href="hedef/gece.jpg" target="_blank" rel="noopener"><img src="hedef/gece.jpg" alt="Çizim 2"></a>
    <a data-ad="naber" href="hedef/naber.jpg" target="_blank" rel="noopener"><img src="hedef/naber.jpg" alt="Çizim 3"></a>
    <a data-ad="uyku" href="hedef/uyku.jpg" target="_blank" rel="noopener"><img src="hedef/uyku.jpg" alt="Çizim 4"></a>
  </div>
  <a class="alt-geri" href="../" aria-label="suatilyus.com'a dön"><img src="../img/ui/geri-tabela.png" alt="Geri" width="800" height="536"></a>
</div>

<div class="kat" id="hata" hidden>
  <h1>OLMADI MORUK</h1>
  <p id="hataYazi">Kamera açılamadı.</p>
  <button class="basla" type="button" onclick="location.reload()">TEKRAR DENE</button>
  <a class="geri" href="../">suatilyus.com'a dön</a>
</div>

<div class="ust" id="ust" hidden>
  <button class="dugme" id="cik" type="button">← ÇIK</button>
  <span style="display:flex;gap:8px"><button class="dugme" id="elle" type="button" hidden>ELİNE AL</button><button class="dugme" id="ses" type="button" hidden>SESİ AÇ</button></span>
</div>
<div class="cerceve" id="cerceve" hidden><i></i><i></i><i></i><i></i></div>
<div class="ipucu" id="ipucu" hidden>telefonu çizime tut…</div>

<script type="module">
import * as THREE from 'three';
import { MindARThree } from 'mindar-image-three';

/* ======================================================================
   ESERLER — every drawing the app knows.  The ORDER of TUM must match the
   order the images were compiled into hedefler.mind.
   ?d=<ad> opens a single drawing with its own hedef-<ad>.mind (street QR).
   tip: 'video' = plain video over the drawing
        'alfa'  = transparent video (colour left half, alpha right half)
        'kat'   = Kat Kat layers
   ====================================================================== */
const ESER = {
  pixel: { tip: 'video', video: 'medya/pixel.mp4', oran: 1202 / 760, dongu: true, ses: true },
  gece:  { tip: 'kat', oran: 1500 / 900, katman: [
    ['1-gece', 1], ['2-yazi', .45], ['3-yazi-golge', 1], ['4-bulut', .65], ['5-isik', .55], ['6-ay', 1], ['7-ev', 1]] },
  naber: { tip: 'alfa', video: 'medya/naber.mp4', oran: 674 / 800, dongu: false },
  uyku:  { tip: 'kat', oran: 1415 / 1000, klasor: 'katman/uyku/', katman: [
    ['1-zemin', 1], ['2-agaclar', 1], ['3-yapraklar', 1], ['4-toprak', 1], ['5-kurt', 1], ['6-adam', 1], ['7-yaprak-on', 1], ['8-kurt-sag', 1]] },
};
const TUM = ['pixel', 'gece', 'naber', 'uyku'];

const $ = id => document.getElementById(id);
const tek = new URLSearchParams(location.search).get('d');
const LISTE = tek && ESER[tek] ? [tek] : TUM;
const V = '?v=' + (window.SURUM || '');          // so a new .mind / layer never comes from an old cache
const MIND = (tek && ESER[tek] ? `./hedef-${tek}.mind` : './hedefler.mind') + V;
// start screen: only the drawings this link knows
document.querySelectorAll('.hedefler a').forEach(a => { if (!LISTE.includes(a.dataset.ad)) a.remove(); });

const ipucu = t => { $('ipucu').textContent = t; $('ipucu').classList.toggle('gizli', !t); };
const tl = new THREE.TextureLoader();
const tex = src => { const t = tl.load(src); t.colorSpace = THREE.SRGBColorSpace; return t; };
const plane = (w, h, map, op = 1) => new THREE.Mesh(new THREE.PlaneGeometry(w, h),
  new THREE.MeshBasicMaterial({ map, transparent: true, opacity: op, depthWrite: false, side: THREE.DoubleSide }));
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const iOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
try { if (iOS && localStorage.getItem('suat-ar-kez')) $('izinNot').hidden = false; } catch (e) {}

/* videos are created up front so the BAŞLA tap can unlock them (iOS) */
const VIDEO = {};
for (const ad of LISTE) {
  const e = ESER[ad]; if (e.tip !== 'video' && e.tip !== 'alfa') continue;
  const v = document.createElement('video');
  Object.assign(v, { src: e.video + V, loop: !!e.dongu, muted: true, playsInline: true, preload: 'auto', crossOrigin: 'anonymous' });
  v.setAttribute('playsinline', ''); v.setAttribute('webkit-playsinline', '');
  VIDEO[ad] = v;
}
const seslenen = () => Object.values(VIDEO);

/* transparent video: colour on the left half, alpha (grey) on the right half */
function alfaMalzeme(video) {
  const t = new THREE.VideoTexture(video); t.colorSpace = THREE.NoColorSpace; t.minFilter = THREE.LinearFilter;
  return new THREE.ShaderMaterial({
    uniforms: { map: { value: t }, op: { value: 0 } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }',
    fragmentShader: 'uniform sampler2D map; uniform float op; varying vec2 vUv; void main(){ vec3 c=texture2D(map,vec2(vUv.x*.5,vUv.y)).rgb; float a=texture2D(map,vec2(.5+vUv.x*.5,vUv.y)).r; gl_FragColor=vec4(c,a*op); }',
    transparent: true, depthWrite: false, side: THREE.DoubleSide
  });
}

let mind = null, calisiyor = false, sahne = [];   // sahne: per-anchor update functions
const katlar = [];                                 // every Kat Kat drawing
const katim = () => katlar.find(k => k.elde()) || katlar.find(k => k.gor()) || null;   // the one ELİNE AL / gestures act on

$('basla').onclick = async () => {
  $('basla').disabled = true; $('basla').textContent = 'AÇILIYOR…';
  for (const v of seslenen()) { try { await v.play(); v.pause(); v.currentTime = 0; } catch (e) {} }
  try {
    if (!mind) kur();
    await mind.start();
    try { localStorage.setItem('suat-ar-kez', '1'); } catch (e) {}
    calisiyor = true; dongu();
    $('giris').hidden = true; $('ust').hidden = false; $('cerceve').hidden = false; $('ipucu').hidden = false;
    ipucu('telefonu çizime tut…');
  } catch (e) {
    console.error(e);
    $('giris').hidden = true; $('hata').hidden = false;
    $('hataYazi').textContent = /Permission|NotAllowed/i.test(String(e && (e.name || e)))
      ? 'Kameraya izin verilmedi. Adres çubuğundaki aA → Web Sitesi Ayarları → Kamera → İzin Ver, sonra tekrar dene.'
      : 'Kamera açılamadı. Safari ya da Chrome ile açtığından emin ol.';
  }
  $('basla').disabled = false; $('basla').textContent = 'BAŞLA';
};

$('cik').onclick = () => {
  calisiyor = false; mind.renderer.setAnimationLoop(null);
  seslenen().forEach(v => v.pause());
  katlar.forEach(k => { k.birak(true); k.sifirla(); });
  try { mind.stop(); } catch (e) {}
  $('ust').hidden = true; $('cerceve').hidden = true; $('ipucu').hidden = true; $('ses').hidden = true; $('elle').hidden = true;
  $('giris').hidden = false;
};

function kur() {
  mind = new MindARThree({
    container: $('ar'), imageTargetSrc: MIND,
    uiLoading: 'no', uiScanning: 'no', uiError: 'no',
    filterMinCF: 0.0001, filterBeta: 0.01, missTolerance: 8, warmupTolerance: 3
  });
  mind.renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  LISTE.forEach((ad, i) => {
    const e = ESER[ad], a = mind.addAnchor(i);
    if (e.tip === 'kat') katlar.push(katKur(a, e, ad));
    else videoKur(a, e, VIDEO[ad]);
  });
}

/* ---------- video / transparent video ---------- */
function videoKur(a, e, video) {
  let mesh, gor = false, kayip = 0;
  if (e.tip === 'alfa') mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, e.oran), alfaMalzeme(video));
  else { const t = new THREE.VideoTexture(video); t.colorSpace = THREE.SRGBColorSpace; mesh = plane(1, e.oran, t, 0); }
  a.group.add(mesh);
  a.onTargetFound = () => {
    gor = true; bul(true); ipucu(''); $('ses').hidden = !e.ses;
    // a one-shot animation starts over when you come back after a while
    if (!e.dongu && (video.ended || Date.now() - kayip > 4000)) video.currentTime = 0;
    video.play().catch(() => {});
  };
  a.onTargetLost = () => { gor = false; kayip = Date.now(); video.pause(); bul(false); };
  const opak = v => e.tip === 'alfa' ? (mesh.material.uniforms.op.value = v) : (mesh.material.opacity = v);
  const simdi = () => e.tip === 'alfa' ? mesh.material.uniforms.op.value : mesh.material.opacity;
  sahne.push(dt => opak(simdi() + ((gor && video.readyState >= 2 ? 1 : 0) - simdi()) * Math.min(1, dt * 8)));
}

/* ---------- Kat Kat ---------- */
function katKur(a1, e, ad) {
  const ARA = 0.11, DERIN = (e.katman.length - 1) * ARA;
  const kg = new THREE.Group(), ic = new THREE.Group(); kg.add(ic); a1.group.add(kg);
  const butun = plane(1, e.oran, tex(`hedef/${ad}.jpg${V}`), 0); butun.renderOrder = 0; ic.add(butun);
  const kats = e.katman.map(([k, op], i) => {
    const m = plane(1, e.oran, tex(`${e.klasor || 'katman/'}${k}.webp${V}`), 0);
    m.renderOrder = 1 + i; m.userData.op = op; ic.add(m);
    const kenar = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(1, e.oran)),
      new THREE.LineBasicMaterial({ color: 0x7fd4ff, transparent: true, opacity: 0, depthWrite: false }));
    kenar.renderOrder = 50; m.add(kenar); m.userData.kenar = kenar;
    return m;
  });
  let acik = 0, hedef = 0, gor = false, zaman = null, elde = false;
  a1.onTargetFound = () => {
    if (elde || katlar.some(k => k.elde())) return;   // another drawing is in hand
    gor = true; ipucu(''); bul(true); clearTimeout(zaman);
    zaman = setTimeout(() => { if (gor) { hedef = 1; $('elle').hidden = false; ipucu('ELİNE AL: parmağınla çevir, yandan bak'); setTimeout(() => gor && !elde && ipucu(''), 3500); } }, 700);
  };
  a1.onTargetLost = () => { if (elde || !gor) return; gor = false; clearTimeout(zaman); hedef = 0; acik = 0; $('elle').hidden = true; bul(false); };

  const al = () => {
    if (!gor) return;
    hedef = 1; acik = 1;
    mind.scene.attach(kg); kg.translateZ(DERIN / 2); ic.position.z = -DERIN / 2;
    elde = true; $('elle').textContent = 'ÇİZİME GERİ KOY';
    $('cerceve').classList.add('gizli'); ipucu('parmağınla çevir · iki parmakla büyüt');
  };
  const birak = sessiz => {
    if (!elde) return;
    elde = false; ic.position.z = 0;
    a1.group.add(kg); kg.position.set(0, 0, 0); kg.rotation.set(0, 0, 0); kg.scale.set(1, 1, 1);
    $('elle').textContent = 'ELİNE AL';
    if (!sessiz) { gor = a1.group.visible; if (!gor) { hedef = 0; acik = 0; $('elle').hidden = true; bul(false); } else ipucu(''); }
  };
  sahne.push(dt => {
    acik += (hedef - acik) * Math.min(1, dt * 2.2);
    if (Math.abs(hedef - acik) < .002) acik = hedef;
    const k = ease(acik), g = (gor || elde) ? 1 : 0, n = kats.length;
    butun.material.opacity = g * (1 - Math.min(1, k * 3));
    kats.forEach((m, i) => {
      m.position.z = k * i * ARA;
      m.position.y = elde ? 0 : k * (i - (n - 1) / 2) * 0.012;
      m.rotation.y = elde ? 0 : k * (i - (n - 1) / 2) * 0.02;
      m.material.opacity = g * m.userData.op * Math.min(1, k * 3);
      m.userData.kenar.material.opacity = g * k * .55;
    });
    if (!elde) kg.rotation.x = -k * 0.12;
  });
  return {
    al, birak, kg,
    elde: () => elde, gor: () => gor,
    tik: () => { if (gor && !elde) hedef = hedef ? 0 : 1; },
    sifirla: () => { hedef = 0; acik = 0; gor = false; }
  };
}

/* ELİNE AL button + gestures */
$('elle').onclick = () => { const k = katim(); if (k) k.elde() ? k.birak() : k.al(); };
let dokun = {}, ilk = null;
const ar = $('ar');
ar.addEventListener('pointerdown', e => { dokun[e.pointerId] = { x: e.clientX, y: e.clientY }; ilk = { t: Date.now(), x: e.clientX, y: e.clientY, n: Object.keys(dokun).length }; });
ar.addEventListener('pointermove', e => {
  const o = dokun[e.pointerId]; if (!o) return;
  const ids = Object.keys(dokun), k = katim(), held = k && k.elde();
  if (held && ids.length === 1) {
    k.kg.rotation.y += (e.clientX - o.x) * 0.008;
    k.kg.rotation.x = Math.max(-1.2, Math.min(1.2, k.kg.rotation.x + (e.clientY - o.y) * 0.008));
  } else if (held && ids.length === 2) {
    const [p, q] = ids.map(i => dokun[i]);
    const once = Math.hypot(p.x - q.x, p.y - q.y);
    o.x = e.clientX; o.y = e.clientY;
    const sonra = Math.hypot(p.x - q.x, p.y - q.y);
    if (once > 10) k.kg.scale.multiplyScalar(Math.max(.92, Math.min(1.08, sonra / once)));
    k.kg.scale.clampScalar(.3, 3);
    return;
  }
  o.x = e.clientX; o.y = e.clientY;
});
const bitir = e => {
  delete dokun[e.pointerId];
  if (ilk && ilk.n === 1 && Date.now() - ilk.t < 300 && Math.hypot(e.clientX - ilk.x, e.clientY - ilk.y) < 10 && katim()) katim().tik();
  ilk = null;
};
ar.addEventListener('pointerup', bitir); ar.addEventListener('pointercancel', bitir);

function dongu() {
  const { renderer, scene, camera } = mind, saat = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    if (!calisiyor) return;
    const dt = Math.min(saat.getDelta(), .05);
    sahne.forEach(f => f(dt));
    renderer.render(scene, camera);
  });
}

function bul(var_) {
  $('cerceve').classList.toggle('gizli', var_);
  if (!var_) { $('ses').hidden = true; ipucu('telefonu çizime tut…'); }
}

$('ses').onclick = () => {
  const ac = seslenen().some(v => v.muted);
  seslenen().forEach(v => { v.muted = !ac; });
  seslenen().forEach(v => { if (!v.paused) v.play().catch(() => {}); });
  $('ses').textContent = ac ? 'SESİ KAPAT' : 'SESİ AÇ';
};
document.addEventListener('visibilitychange', () => { if (document.hidden) seslenen().forEach(v => v.pause()); });
</script>
</body>
</html>
