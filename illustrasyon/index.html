<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>İllüstrasyon — suatilyus</title>
<meta name="description" content="suatilyus çizimleri — illüstrasyon, mural, poster.">
<link rel="icon" href="../img/icon-192.png">
<link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
<link rel="manifest" href="../manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../ortak.css?v=2611241350">
<style>
:root{--ink:#111}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff;color:var(--ink);font-family:"suat-long","Patrick Hand",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
img{display:block;max-width:100%;height:auto}
a{color:inherit;text-decoration:none}
.page{width:min(100%,520px);margin:0 auto;container-type:inline-size;padding:calc(env(safe-area-inset-top) + min(15vw,78px)) min(6vw,31px) min(16vw,83px);display:flex;flex-direction:column;align-items:center}
.amblem{width:80cqw;transition:transform .2s}
.amblem:hover{transform:rotate(-2deg) scale(1.03)}
h1{font-size:11cqw;font-weight:400;letter-spacing:.04em;margin-top:5cqw;line-height:1}
.sub{font-size:5cqw;margin-top:1.5cqw;color:#555;text-align:center}
.divider{width:100%;margin:6cqw 0 5cqw}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:7cqw 5cqw;width:100%;align-items:start}
.grid .wp{display:block;width:100%}
.wp{appearance:none;border:0;background:none;padding:0;cursor:pointer;text-align:center;font:inherit;color:inherit}
.frame{border:.6cqw solid var(--ink);border-radius:5cqw;outline:.3cqw solid var(--ink);outline-offset:-2cqw;overflow:hidden;background:#f3f3f3;display:block;min-height:20cqw;transition:transform .15s}
.frame img{width:100%;height:auto;display:block;max-width:none}
.frame.empty{aspect-ratio:3/4}
.frame.empty{background:#fafafa;display:flex;align-items:center;justify-content:center}
.frame.empty img{display:none}
.frame.empty::before{content:"YAKINDA";font-size:6cqw;color:#aaa;letter-spacing:.05em}
.wp{position:relative}
.wp .tag{position:absolute;width:11cqw;top:-4cqw;right:-3cqw;transform:rotate(10deg);z-index:2}
.wp .tag.yeni{width:21cqw;top:2cqw;right:auto;left:-3.5cqw;transform:rotate(-10deg)}
.wp .tag.yakinda{width:27cqw;top:auto;bottom:8cqw;right:auto;left:50%;transform:translateX(-50%) rotate(-6deg)}
.wp:hover .frame{transform:rotate(-1.5deg)}
.wp b{display:block;font-weight:400;font-size:5.2cqw;margin-top:1.6cqw;letter-spacing:.03em}
.wp span{display:block;font-size:4cqw;color:#777}

.view{position:fixed;inset:0;background:rgba(255,255,255,.97);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);z-index:9}
.view.show{display:flex}
.view .big{max-height:72vh;width:auto;border:3px solid var(--ink);border-radius:22px}
.view .row{display:flex;gap:18px;align-items:center}
.view .dl{width:120px}
.view .share{width:48px}
.view .x{width:150px}
.view .tip{font-size:16px;color:#666;text-align:center;max-width:32ch}
</style>
</head>
<body>
<main class="page">
  <a href="../index.html" aria-label="Ana sayfaya dön" style="display:block"><span class="amblem cz lit"><img class="c" src="../img/ui/amblem-c.png" alt=""><img src="../img/ui/amblem.png" alt="Ana sayfa" width="865" height="286"></span></a>
  <h1>İLLÜSTRASYON</h1>
  <p class="sub">çizimler — BELEŞ yazanları indir, kullan</p>
  <img class="divider" src="../img/divider.png" alt="" width="1062" height="54">
  <div class="grid" id="grid"></div>
  <a class="alt-geri" href="../index.html" aria-label="Geri dön"><img src="../img/ui/geri-tabela.png" alt="Geri" width="800" height="536"></a>
</main>
<script src="../ortak.js?v=2611241350"></script>

<div class="view" id="view" role="dialog" aria-modal="true" aria-label="Çizim">
  <img class="big" id="big" alt="">
  <div class="row">
    <a class="dl cz" id="dl" download><img class="c" src="../img/ui/indir-a-c.png" alt=""><img src="../img/ui/indir-a.png" alt="İndir" width="200" height="109"></a>
    <button class="share cz" id="share" hidden><img class="c" src="../img/ui/ikon-paylas-c.png" alt=""><img src="../img/ui/ikon-paylas.png" alt="Paylaş" width="96" height="154"></button>
    <button class="x cz" id="close"><img class="c" src="../img/ui/cikis-c.png" alt=""><img src="../img/ui/cikis.png" alt="Kapat" width="407" height="143"></button>
  </div>
  <p class="tip">iPhone'da görsele basılı tut → "Fotoğraflara Kaydet".</p>
</div>

<script>
{
/* illustrations come from veri/site.json (control panel) */
let WALL=[];
const grid=document.getElementById('grid'),view=document.getElementById('view'),big=document.getElementById('big'),dl=document.getElementById('dl'),E=suat.esc;
function render(){
  const tag=(k,alt,w,h)=>`<span class="tag ${k} cz"><img class="c" src="../img/ui/${k}-c.png" alt=""><img src="../img/ui/${k}.png" alt="${alt}" width="${w}" height="${h}"></span>`;
  const cards=WALL.map((w,i)=>`<button class="wp" data-i="${i}">${w.indir?tag('beles','Beleş',183,204):''}${w.yeni?tag('yeni','Yeni',321,241):''}${w.yakinda?tag('yakinda','Yakında! Aha burada!',615,391):''}<div class="frame"><img src="../${E(w.dosya)}" alt="${E(w.ad)}"></div><b>${E(w.ad)}</b>${w.not?`<span>${E(w.not)}</span>`:''}</button>`);
  if(!WALL.length)cards.push(`<button class="wp" data-empty="1"><div class="frame empty taped"></div><b>YAKINDA</b></button>`);
  grid.innerHTML=cards.join('');
}
suat.veri().then(d=>{const G={beles:true,yeni:true,yakinda:true,...(d.etiketler||{})};WALL=(d.illustrasyon||[]).map(w=>({...w,indir:!!w.indir&&G.beles,yeni:!!w.yeni&&G.yeni,yakinda:!!w.yakinda&&G.yakinda,ad:String(w.ad||'').replace(/^DUVAR (\d+)$/,'İLLÜSTRASYON $1')}));render()});
let cur=null;
grid.addEventListener('click',e=>{const b=e.target.closest('.wp');if(!b)return;if(b.dataset.empty){suat.yakinda();return}cur=WALL[+b.dataset.i];
  big.src='../'+cur.dosya;big.alt=cur.ad;dl.href=big.src;dl.hidden=!cur.indir;dl.setAttribute('download','suatilyus-'+cur.dosya.split('/').pop());view.classList.add('show')});
const close=()=>view.classList.remove('show');
const shareBtn=document.getElementById('share');shareBtn.hidden=!navigator.share;
shareBtn.addEventListener('click',async()=>{try{await navigator.share({title:'suatilyus — '+cur.ad,text:'suatilyus çizimi',url:location.href})}catch(e){}});
document.getElementById('close').addEventListener('click',close);
view.addEventListener('click',e=>{if(e.target===view)close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
}
</script>
</body>
</html>
