<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SRF — suatilyus Referans Fabrikası</title>
<meta name="description" content="suatilyus Referans Fabrikası: kâğıda çöp adamdan istediğin pozu çiz, çek, biz üretelim.">
<link rel="icon" href="../../img/icon-192.png">
<link rel="apple-touch-icon" href="../../img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../ortak.css?v=2611241540">
<style>
/* VOICE: suatilyus'un elle çizdiği arayüz eskizi, çalışan hali
   IDEA: kâğıttaki iki uzun çerçeve (Eskiz | Referans) gerçek araca dönüşüyor
   PICTURE: solda çöp adam eskizi, sağda ışıklı 3B manken
   COLOUR and TYPE: beyaz kâğıt, kalın siyah çerçeve, butonlar onun boyalı çizimleri; Amatic SC + Patrick Hand
   LAYOUT: iki çerçeve yan yana, 860px altında alt alta */
:root{color-scheme:light;--bg:#fff;--ink:#111;--soft:#666;--blue:#2f86d6}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 "Patrick Hand",system-ui,sans-serif;overflow-x:clip}
img{display:block;max-width:100%;height:auto}
button,label.btn{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ib{display:inline-block;transition:transform .15s,opacity .15s,filter .15s}
.ib:hover{transform:rotate(-2deg) scale(1.04)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px dashed var(--ink);outline-offset:4px}
.off{opacity:.38;filter:grayscale(.6)}
.on{transform:scale(1.07) rotate(-2deg)}
.wrap{max-width:1240px;margin:0 auto;padding:clamp(14px,2.5vw,32px) max(4vw,14px) 50px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.nav{display:flex;align-items:center;gap:14px}.nav .geri{width:clamp(78px,11vw,105px)}.nav .home{width:clamp(110px,15vw,150px)}
.wip{font-family:"suat-skinny","Amatic SC",sans-serif;font-weight:700;font-size:26px;line-height:1;padding:8px 16px;border:4px solid var(--ink);border-radius:8px 16px 6px 14px;
  background:repeating-linear-gradient(-45deg,#fbb321 0 14px,#fff 14px 28px);box-shadow:4px 4px 0 var(--ink);transform:rotate(2deg)}
.wip span{background:#fff;padding:0 6px}
.frames{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(18px,3vw,44px)}
.frame{position:relative;border:5px solid var(--ink);border-radius:3px 8px 4px 6px;padding:14px 14px 18px;background:#fff;display:flex;flex-direction:column}
.frame::before,.frame::after{content:"";position:absolute;background:var(--ink);border-radius:3px}
.frame::before{left:-14px;right:-14px;bottom:-5px;height:5px}
.frame::after{top:-14px;bottom:-14px;right:-5px;width:5px}
.fhead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.fhead .t{height:32px;width:auto;align-self:start}
.src{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.src img{height:58px;width:auto}
.bas img{height:110px;width:auto}
.bas.busy img{animation:wob .45s infinite alternate}
@keyframes wob{to{transform:rotate(4deg) scale(.94)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-family:"suat-skinny","Amatic SC",sans-serif;font-weight:700;font-size:21px;line-height:1;padding:7px 12px 6px;border:3px solid var(--ink);border-radius:12px 8px 14px 9px;background:#fff;cursor:pointer;min-height:40px}
.chip.on{background:var(--ink);color:#fff;transform:rotate(-2deg)}
.board{position:relative;margin-top:30px}
.tab{position:absolute;left:50%;top:-29px;transform:translateX(-50%);width:40%;z-index:2}
.tab:hover{transform:translateX(-50%) rotate(-2deg)}
.tab span{position:absolute;inset:0;display:grid;place-items:center;font-family:"suat-skinny","Amatic SC";font-weight:700;font-size:22px}
.stage{position:relative;height:clamp(380px,60vh,640px);border:5px solid var(--ink);border-radius:6px 8px 14px 8px;overflow:hidden;background:#fff}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#c2{cursor:crosshair}
.mode{position:absolute;left:8px;top:8px;font-size:14px;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:1px 8px;pointer-events:none}
.status{min-height:1.5em;font-size:15px;color:var(--soft);margin:8px 2px 0}
.status.busy::before{content:"";display:inline-block;width:10px;height:10px;margin-right:6px;border-radius:50%;border:2px solid var(--ink);border-right-color:transparent;vertical-align:-1px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.photo{display:none;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:15px;margin-top:6px}
.photo.show{display:flex}
.brush{position:relative;margin-top:12px}
.brush input{position:absolute;left:24%;right:6%;top:50%;transform:translateY(-50%);width:auto;opacity:0;height:44px;cursor:pointer}
.bsize{display:flex;justify-content:center;align-items:center;gap:14px;font-size:22px}
.bsize button{width:44px;height:44px;font-size:28px;line-height:1}
.bsize output{min-width:70px;text-align:center;border:3px solid var(--ink);border-radius:8px;padding:0 8px}
.hint{font-size:14px;color:var(--soft);margin-top:8px}
.hint b{color:var(--ink)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--blue);vertical-align:-1px}
.steps{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px 10px;align-items:center;margin-top:4px}
.steps .col{display:flex;flex-direction:column;align-items:center;gap:6px}
.badge{height:42px;width:auto}
.ch{height:56px;width:auto}.ch.big{height:80px}
.mid img{width:clamp(80px,9vw,118px)}
.cam{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;border-top:5px solid var(--ink);border-bottom:3px solid var(--ink);margin:12px -14px 12px;padding:10px 8px}
.cam img{height:50px;width:auto}
.cam .lbl{display:flex;flex-direction:column;align-items:center}
.cam .lbl img{height:26px}.cam .lbl img+img{height:42px}
#s3{background:#f1eee8}
.sliders{display:grid;gap:4px;margin-top:12px}
.sl{display:grid;grid-template-columns:7.2em minmax(0,1fr) 3.6em;gap:10px;align-items:center;font-size:16px}
.sl output{text-align:right;white-space:nowrap;color:var(--soft)}
details{margin-top:8px;border-top:3px solid var(--ink);padding-top:6px}
summary{cursor:pointer;font-family:"suat-skinny","Amatic SC";font-weight:700;font-size:24px;min-height:40px;display:flex;align-items:center}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:40px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:16px;border:0;background:url(../../img/ui/kaydirak-ray.png) center/100% 100% no-repeat}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-7px;border:0;border-radius:50%;background:url(../../img/ui/kaydirak-top.png) center/contain no-repeat}
input[type=range]::-moz-range-track{height:16px;border:0;background:url(../../img/ui/kaydirak-ray.png) center/100% 100% no-repeat}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border:0;border-radius:50%;background:url(../../img/ui/kaydirak-top.png) center/contain no-repeat}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--ink)}
@media(max-width:860px){.frames{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.bas img{height:88px}.src img{height:50px}.ch{height:46px}.ch.big{height:66px}.cam img{height:42px}.wip{font-size:21px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.srf-logo{display:block;width:min(92%,520px);height:auto;margin:6px auto 14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <nav class="nav">
      <a class="geri" href="../index.html" aria-label="Geri: uygulamalar"><img src="../../img/ui/geri-tabela.png" alt="Geri" width="800" height="536" style="display:block;width:100%;height:auto"></a>
      <a class="home cz lit" href="../../index.html" aria-label="Ana sayfa"><img class="c" src="../../img/ui/anasayfa-c.png" alt=""><img src="../../img/ui/anasayfa.png" alt="Ana sayfa" width="370" height="105"></a>
    </nav>
    <div class="wip"><span>yapım aşamasında</span></div>
  </div>
  <img class="srf-logo" src="../../img/ui/srf-logo.png" alt="SRF — çiz, yükle, gör" width="1000" height="474">
  <div class="frames">

    <!-- ESKİZ -->
    <section class="frame">
      <div class="fhead">
        <img class="t" src="img/eskiz.png" alt="Eskiz">
        <div class="src">
          <button class="ib" id="upload"><img src="img/yukle.png" alt="Fotoğraf yükle"></button>
          <input type="file" id="file" accept="image/*" hidden>
          <button class="ib off" id="cizBtn" aria-pressed="false"><img src="img/ciz.png" alt="Çiz"></button>
        </div>
        <button class="ib bas" id="detect"><img src="img/bas.png" alt="Bas — çizimi oku"></button>
      </div>
      <div class="chips">
        <button class="chip" data-preset="ayakta">Ayakta</button>
        <button class="chip" data-preset="yuruyus">Yürüyüş</button>
        <button class="chip" data-preset="kosu">Koşu</button>
        <button class="chip" data-preset="oturma">Oturma</button>
        <button class="chip" data-preset="uzanma">Uzanma</button>
        <button class="chip" data-preset="kambur">Bezgin</button>
        <button class="chip" id="mirror">Aynala</button>
      </div>
      <div class="board">
        <button class="tab ib" id="clearPhoto" title="Çizimi ve fotoğrafı temizle"><img src="img/tab.png" alt=""><span>temizle</span></button>
        <div class="stage"><canvas id="c2" aria-label="Çöp adam eskiz alanı"></canvas><div class="mode" id="mode">eklem modu</div></div>
      </div>
      <div class="photo" id="photoRow">
        <label><input type="checkbox" id="showPhoto" checked> Çizimi göster</label>
        <label class="sl" style="grid-template-columns:auto 120px">Saydamlık <input type="range" id="photoAlpha" min="10" max="100" value="45"></label>
      </div>
      <p class="status" id="status"></p>
      <div class="brush">
        <img src="img/brush.png" alt="Brush">
        <input id="bsl" type="range" min="1" max="100" value="8" aria-label="Fırça kalınlığı">
      </div>
      <div class="bsize">
        <button id="bplus" aria-label="Büyüt">+</button><output id="bval">8</output><button id="bminus" aria-label="Küçült">−</button>
      </div>
      <p class="hint"><b>Eklem modu:</b> eklemleri ve güneşi sürükle. Ekleme dokun: uzuv öne/arkaya (dolu nokta öne, boş nokta arkaya). Güneşe dokun: ışık önden/arkadan. <span class="dot"></span> mavi taraf figürün solu.
      <b>Çiz modu:</b> çöp adamı elle çiz, sonra BAS.</p>
    </section>

    <!-- REFERANS -->
    <section class="frame">
      <img src="img/referans.png" alt="Referans" style="height:32px;width:auto">
      <div class="steps">
        <div class="col">
          <img class="badge" src="img/adim1.png" alt="1. adım">
          <button class="ib" data-body="kadin"><img class="ch" src="img/kadin.png" alt="Kadın"></button>
          <button class="ib" data-body="erkek"><img class="ch" src="img/erkek.png" alt="Erkek"></button>
        </div>
        <div class="mid"><img src="img/oranlar.png" alt="Oranlar"></div>
        <div class="col">
          <img class="badge" src="img/adim2.png" alt="2. adım">
          <button class="ib" id="normal"><img class="ch" src="img/normal.png" alt="Normal oran"></button>
          <button class="ib" id="myStyle"><img class="ch big" src="img/suatilyus.png" alt="suatilyus oranı"></button>
        </div>
      </div>
      <div class="cam">
        <button class="ib" data-view="0"><img src="img/on.png" alt="Ön"></button>
        <button class="ib" data-view="45"><img src="img/ceyrek.png" alt="3/4"></button>
        <span class="lbl"><img src="img/kamera.png" alt="Kamera"><button class="ib" id="top" title="Kuş bakışı"><img src="img/cop.png" alt="Kuş bakışı"></button></span>
        <button class="ib" data-view="90"><img src="img/yan.png" alt="Yan"></button>
        <button class="ib" data-view="180"><img src="img/arka.png" alt="Arka"></button>
      </div>
      <div class="stage" id="s3"><canvas id="c3" aria-label="3B manken referansı"></canvas></div>
      <div class="sliders">
        <label class="sl">360° döndür <input id="yaw" type="range" min="0" max="360" value="0"><output id="o-yaw">0°</output></label>
        <label class="sl">Dikey açı <input id="pitch" type="range" min="-35" max="85" value="8"><output id="o-pitch">8°</output></label>
        <label class="sl">Ortam ışığı <input id="amb" type="range" min="0" max="100" value="35"><output id="o-amb">35</output></label>
      </div>
      <details>
        <summary>Beden ayarları</summary>
        <div class="sliders">
          <label class="sl">Kol-bacak <input id="limb" type="range" min="100" max="160" value="100"><output id="o-limb">1.00×</output></label>
          <label class="sl">Kalınlık <input id="thin" type="range" min="45" max="130" value="100"><output id="o-thin">100</output></label>
          <label class="sl">Kamburluk <input id="slouch" type="range" min="0" max="55" value="0"><output id="o-slouch">0°</output></label>
          <label class="sl">Gövde dönüşü <input id="twist" type="range" min="-90" max="90" value="0"><output id="o-twist">0°</output></label>
          <label class="sl">Baş dönüşü <input id="headturn" type="range" min="-80" max="80" value="0"><output id="o-head">0°</output></label>
        </div>
      </details>
    </section>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
/* ---------- iskelet ---------- */
const BASE={neck:.52,head:.20,lElbow:.31,lHand:.27,rElbow:.31,rHand:.27,lKnee:.44,lFoot:.43,rKnee:.44,rFoot:.43};
const LEN={...BASE};
const PARENT={neck:'pelvis',head:'neck',lElbow:'neck',lHand:'lElbow',rElbow:'neck',rHand:'rElbow',lKnee:'pelvis',lFoot:'lKnee',rKnee:'pelvis',rFoot:'rKnee'};
const ORDER=['pelvis','neck','head','lElbow','lHand','rElbow','rHand','lKnee','lFoot','rKnee','rFoot'];
const KIDS={};ORDER.forEach(j=>KIDS[j]=[]);Object.keys(PARENT).forEach(c=>KIDS[PARENT[c]].push(c));
const LEFT=new Set(['lElbow','lHand','lKnee','lFoot']);

const PRESETS={
  ayakta:{pelvis:[0,.95,1],neck:[0,1.47,1],head:[0,1.67,1],lElbow:[.12,1.184,1],lHand:[.18,.921,1],rElbow:[-.12,1.184,1],rHand:[-.18,.921,1],
          lKnee:[.06,.514,1],lFoot:[.08,.085,1],rKnee:[-.06,.514,1],rFoot:[-.08,.085,1]},
  yuruyus:{pelvis:[0,.93,1],neck:[0,1.45,1],head:[.01,1.65,1],lElbow:[.13,1.18,-1],lHand:[.14,.95,-1],rElbow:[-.13,1.18,1],rHand:[-.12,.94,1],
          lKnee:[.05,.55,1],lFoot:[.06,.13,1],rKnee:[-.05,.51,-1],rFoot:[-.07,.12,-1]},
  kosu:{pelvis:[0,.95,1],neck:[.02,1.45,1],head:[.03,1.64,1],lElbow:[.15,1.23,-1],lHand:[.13,1.0,1],rElbow:[-.14,1.22,1],rHand:[-.10,1.32,1],
          lKnee:[.05,.75,1],lFoot:[.04,.36,-1],rKnee:[-.05,.55,-1],rFoot:[-.06,.25,-1]},
  oturma:{pelvis:[0,.52,1],neck:[0,1.04,-1],head:[0,1.24,1],lElbow:[.15,.77,1],lHand:[.13,.57,1],rElbow:[-.15,.77,1],rHand:[-.13,.57,1],
          lKnee:[.1,.5,1],lFoot:[.11,.08,1],rKnee:[-.1,.5,1],rFoot:[-.11,.08,1]},
  uzanma:{pelvis:[0,.95,1],neck:[0,1.47,1],head:[0,1.67,1],lElbow:[.29,1.58,1],lHand:[.4,1.83,1],rElbow:[-.3,1.4,1],rHand:[-.57,1.42,1],
          lKnee:[.12,.53,1],lFoot:[.2,.11,1],rKnee:[-.03,.6,1],rFoot:[-.06,.18,-1]},
  kambur:{pelvis:[0,.6,1],neck:[.03,1.11,-1],head:[.05,1.28,1],lElbow:[.1,.82,1],lHand:[.08,.6,1],rElbow:[-.09,.83,1],rHand:[-.06,.62,1],
          lKnee:[.14,.62,1],lFoot:[.16,.2,1],rKnee:[-.13,.6,1],rFoot:[-.15,.18,1]}
};

const S={p:{},s:{},light:{x:-.55,y:1.85,front:true},yaw:0,pitch:8,twist:0,head:0,amb:35,limb:1,thin:1,slouch:0,body:'kadin',draw:false};
let T=null; // fotoğraf ya da elle çizim izi

function lenFor(j,f){if(j==='neck')return BASE.neck*(1+(f-1)*.25);if(j==='head')return BASE.head*(1+(f-1)*.45);return BASE[j]*f;}
const hf=()=>.45+.55*S.limb;
function setLimb(f){
  const old={...LEN},P0=JSON.parse(JSON.stringify(S.p));
  ORDER.forEach(j=>{if(PARENT[j])LEN[j]=lenFor(j,f)});
  ORDER.slice(1).forEach(j=>{const pp=PARENT[j],r=LEN[j]/old[j];
    S.p[j]=[S.p[pp][0]+(P0[j][0]-P0[pp][0])*r,S.p[pp][1]+(P0[j][1]-P0[pp][1])*r];});
  S.limb=f;groundFigure();
}
function groundFigure(){
  let m=Infinity;ORDER.forEach(j=>m=Math.min(m,S.p[j][1]));
  const dy=.08-m;ORDER.forEach(j=>S.p[j][1]+=dy);if(T&&T.s)T.oy+=dy;
}
function applyPreset(name){
  const P=PRESETS[name],f=S.limb;
  ORDER.forEach(j=>{if(PARENT[j])LEN[j]=BASE[j]});
  ORDER.forEach(j=>{S.p[j]=[P[j][0],P[j][1]];S.s[j]=P[j][2];});
  ORDER.forEach(j=>{if(PARENT[j])S.p[j]=clampTo(j)});
  S.limb=1;setLimb(f);
  if(name==='kambur'){S.slouch=35;S.head=0;setSlider('slouch',35);}
  markPreset(name);redraw();
}
function markPreset(n){document.querySelectorAll('[data-preset]').forEach(b=>b.classList.toggle('on',b.dataset.preset===n));}
function clampTo(j){
  const pp=S.p[PARENT[j]],p=S.p[j],L=LEN[j];
  let dx=p[0]-pp[0],dy=p[1]-pp[1],d=Math.hypot(dx,dy);
  if(d>L){const k=L/d;dx*=k;dy*=k;}
  return [pp[0]+dx,pp[1]+dy];
}
function subtree(j,out=[]){out.push(j);KIDS[j].forEach(k=>subtree(k,out));return out;}
function moveJoint(j,t){
  let nx=t[0],ny=t[1];
  if(PARENT[j]){const pp=S.p[PARENT[j]],L=LEN[j];let dx=nx-pp[0],dy=ny-pp[1],d=Math.hypot(dx,dy);
    if(d>L){dx*=L/d;dy*=L/d;}nx=pp[0]+dx;ny=pp[1]+dy;}
  const ddx=nx-S.p[j][0],ddy=ny-S.p[j][1];
  subtree(j).forEach(k=>{S.p[k]=[S.p[k][0]+ddx,S.p[k][1]+ddy]});
}
function depthOf(j){const pp=S.p[PARENT[j]],p=S.p[j],L=LEN[j];const d=Math.hypot(p[0]-pp[0],p[1]-pp[1]);return Math.sqrt(Math.max(0,L*L-d*d));}
function lift(){
  const P={pelvis:[S.p.pelvis[0],S.p.pelvis[1],0]};
  ORDER.slice(1).forEach(j=>{P[j]=[S.p[j][0],S.p[j][1],P[PARENT[j]][2]+S.s[j]*depthOf(j)]});
  return P;
}

/* ---------- 2B eskiz ---------- */
const c2=document.getElementById('c2'),ctx=c2.getContext('2d');
let W2=0,H2=0,SC=1;
function size2(){const r=c2.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);
  W2=r.width;H2=r.height;c2.width=Math.round(W2*dpr);c2.height=Math.round(H2*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);}
function calcSC(){SC=Math.min(H2/(1.9*hf()+.3),W2/(1.7*hf()));}
const toPx=(x,y)=>[W2/2+x*SC,H2-(y+.12)*SC];
const toW=(px,py)=>[(px-W2/2)/SC,(H2-py)/SC-.12];

function draw2D(){
  calcSC();
  ctx.globalAlpha=1;ctx.clearRect(0,0,W2,H2);ctx.fillStyle='#fff';ctx.fillRect(0,0,W2,H2);
  if(T&&T.show&&T.s){const tl=toPx(T.ox,T.oy);ctx.globalAlpha=S.draw?1:T.alpha;
    ctx.drawImage(T.img,tl[0],tl[1],T.img.width*T.s*SC,T.img.height*T.s*SC);ctx.globalAlpha=1;}
  const g=toPx(0,0);ctx.strokeStyle='#e6e9ec';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,g[1]);ctx.lineTo(W2,g[1]);ctx.stroke();
  if(S.draw&&T&&T.drawn)return; // çiz modunda, çizim varken iskelet gizli
  ctx.save();if(S.draw)ctx.globalAlpha=.18;
  const L=toPx(S.light.x,S.light.y),r=15;
  ctx.strokeStyle='#d8a400';ctx.lineWidth=2;ctx.lineCap='round';
  for(let i=0;i<8;i++){const a=i*Math.PI/4;ctx.beginPath();ctx.moveTo(L[0]+Math.cos(a)*(r+5),L[1]+Math.sin(a)*(r+5));ctx.lineTo(L[0]+Math.cos(a)*(r+11),L[1]+Math.sin(a)*(r+11));ctx.stroke();}
  ctx.beginPath();ctx.arc(L[0],L[1],r,0,Math.PI*2);
  if(S.light.front){ctx.fillStyle='#fbb321';ctx.fill();}else{ctx.fillStyle='#fff';ctx.fill();ctx.setLineDash([4,3]);ctx.stroke();ctx.setLineDash([]);}
  ctx.stroke();ctx.fillStyle='#8a6a00';ctx.font='16px "Patrick Hand",system-ui';ctx.textAlign='center';
  ctx.fillText(S.light.front?'önden':'arkadan',L[0],L[1]+r+24);

  const P3=lift(),base=ctx.globalAlpha;
  ctx.lineCap='round';ctx.lineJoin='round';
  const bones=[['pelvis','neck'],['neck','lElbow'],['lElbow','lHand'],['neck','rElbow'],['rElbow','rHand'],['pelvis','lKnee'],['lKnee','lFoot'],['pelvis','rKnee'],['rKnee','rFoot']];
  bones.sort((a,b)=>(P3[a[0]][2]+P3[a[1]][2])-(P3[b[0]][2]+P3[b[1]][2])).forEach(([a,b])=>{
    const A=toPx(...S.p[a]),B=toPx(...S.p[b]),back=S.s[b]<0&&depthOf(b)>.03;
    ctx.strokeStyle=LEFT.has(b)?'#2f86d6':'#111';ctx.globalAlpha=base*(back?.35:1);ctx.lineWidth=back?5:6.5;
    ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke();ctx.globalAlpha=base;
  });
  const N=toPx(...S.p.neck),Hh=toPx(...S.p.head),hr=.11*SC;
  const vx=Hh[0]-N[0],vy=Hh[1]-N[1],vl=Math.hypot(vx,vy)||1;
  ctx.strokeStyle='#111';ctx.lineWidth=6.5;
  ctx.beginPath();ctx.moveTo(N[0],N[1]);ctx.lineTo(Hh[0]-vx/vl*hr,Hh[1]-vy/vl*hr);ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(Hh[0],Hh[1],hr,0,Math.PI*2);ctx.fill();ctx.stroke();
  ORDER.forEach(j=>{
    const [x,y]=toPx(...S.p[j]),flat=!PARENT[j]||depthOf(j)<.03,col=LEFT.has(j)?'#2f86d6':'#111';
    ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,j==='head'||flat?5:7,0,Math.PI*2);
    if(flat||S.s[j]>0){ctx.fillStyle=col;ctx.fill();}else{ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle=col;ctx.stroke();}
    if(j==='pelvis'){ctx.strokeStyle='#111';ctx.beginPath();ctx.arc(x,y,10,0,Math.PI*2);ctx.stroke();}
  });
  ctx.restore();
}

function hit(px,py){
  const L=toPx(S.light.x,S.light.y);if(Math.hypot(px-L[0],py-L[1])<26)return 'light';
  let best=null,bd=24;
  [...ORDER].reverse().forEach(j=>{const p=toPx(...S.p[j]);const d=Math.hypot(px-p[0],py-p[1]);if(d<bd){bd=d;best=j;}});

const PROMPT=`The image is a photo or scan of a very simple hand-drawn stick figure on paper (Turkish "Cin Ali" style: circle head, one line for the torso, lines for arms and legs). Locate its joints.
Return ONLY a JSON object, no prose, no code fences, in exactly this shape:
{"found":true,"joints":{"head":[x,y],"neck":[x,y],"pelvis":[x,y],"lElbow":[x,y],"lHand":[x,y],"rElbow":[x,y],"rHand":[x,y],"lKnee":[x,y],"lFoot":[x,y],"rKnee":[x,y],"rFoot":[x,y]},"depth":{"neck":"flat","lElbow":"flat","lHand":"flat","rElbow":"flat","rHand":"flat","lKnee":"flat","lFoot":"flat","rKnee":"flat","rFoot":"flat"}}
Rules:
- x and y are fractions of the image width and height (0 to 1, origin at the top-left corner).
- head = centre of the head circle. neck = top end of the torso line (where the head connects). pelvis = bottom end of the torso line where the legs start.
- Assume the figure faces the viewer unless it is clearly drawn otherwise. "l" joints belong to the figure's own LEFT side, which appears on the viewer's RIGHT side of the image.
- lHand/rHand and lFoot/rFoot are the ends of the arm and leg lines. If an arm or leg is drawn straight without a bend, put the elbow or knee at its midpoint. If a limb is missing, guess a natural position.
- depth: for each listed joint say whether the segment that ends at that joint points "front" (toward the viewer), "back" (away from the viewer) or "flat", judging from overlaps, shortened lines and the intent of the pose.
- If there is no stick figure in the image, return {"found":false}.`;

async function detect(){
  if(!sample||!T)return;
  detectBtn.disabled=true;detectBtn.classList.add('busy');setStatus('Çizim okunuyor, birkaç saniye sürebilir…',true);
  try{
    const blob=await new Promise(r=>T.img.toBlob(r,'image/jpeg',.88));
    const data=await sample.json(PROMPT,{images:[blob],modelTier:'default'});
    if(S.draw){S.draw=false;cizBtn.classList.add('off');cizBtn.classList.remove('on');modeEl.textContent='eklem modu';}
    if(!applyDetection(data)){setStatus('Çizimde çöp adam bulamadım. Daha net çiz ya da eklemleri elle taşı.');return;}
    T.alpha=.45;photoRow.classList.add('show');draw2D();
    setStatus('Poz yerleşti. Yanlış duran eklemleri sürükleyerek düzelt, öne/arkaya için ekleme dokun.');
  }catch(e){
    const c=e&&e.code;
    setStatus(c==='not_granted'?'Okumaya izin verilmedi. Eklemleri elle taşıyabilirsin.'
      :c==='rate_limited'?'Şu an çok fazla istek var. Biraz bekleyip tekrar BAS.'
      :c==='cancelled'?'':'Okuma başarısız oldu. Tekrar BAS ya da eklemleri elle taşı.');
  }finally{detectBtn.disabled=false;detectBtn.classList.remove('busy');}
}
function applyDetection(d){
  if(!d||!d.found||!d.joints)return false;
  const w=T.img.width,h=T.img.height,px={};
  for(const j of ORDER){const v=d.joints[j];if(!Array.isArray(v)||v.length<2||!isFinite(v[0])||!isFinite(v[1]))return false;
    px[j]=[Math.min(1,Math.max(0,v[0]))*w,Math.min(1,Math.max(0,v[1]))*h];}
  const ratios=ORDER.slice(1).map(j=>Math.hypot(px[j][0]-px[PARENT[j]][0],px[j][1]-px[PARENT[j]][1])/LEN[j]).filter(r=>r>0).sort((a,b)=>a-b);
  if(!ratios.length)return false;
  const k=ratios[Math.floor(.75*(ratios.length-1))],s=1/k;
  let low=0;ORDER.forEach(j=>low=Math.max(low,px[j][1]));
  T.s=s;T.oy=.08+low*s;T.ox=-px.pelvis[0]*s;T.sketch=false;
  ORDER.forEach(j=>{S.p[j]=[px[j][0]*s+T.ox,T.oy-px[j][1]*s];});
  ORDER.forEach(j=>{if(PARENT[j]){S.p[j]=clampTo(j);const dd=d.depth&&d.depth[j];S.s[j]=dd==='back'?-1:1;}});
  markPreset(null);redraw();return true;
}

const scene=new THREE.Scene();scene.background=new THREE.Color(0xf1eee8);

const mat=std(0xb9b2a8),matL=std(0x8fb3d4),matDark=std(0x4a4f56),matHair=std(0x5b4a3b),matStick=std(0xc8452f);
const Y=new THREE.Vector3(0,1,0);
function mesh(geo,m){const o=new THREE.Mesh(geo,m);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o;}
const sph=(r,m)=>mesh(new THREE.SphereGeometry(r,28,20),m);
const ell=m=>mesh(new THREE.SphereGeometry(1,32,24),m);
const cyl=(rb,rt,m)=>mesh(new THREE.CylinderGeometry(rt,rb,1,24,1),m);
function place(o,a,b,rs=1){const d=b.clone().sub(a),l=d.length();o.position.copy(a).addScaledVector(d,.5);o.scale.set(rs,Math.max(l,1e-4),rs);
  if(l>1e-6)o.quaternion.setFromUnitVectors(Y,d.multiplyScalar(1/l));}
function orient(o,B,pos,sx,sy,sz){o.position.copy(pos);o.scale.set(sx,sy,sz);o.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(B.x,B.y,B.z));}
function basis(u,f){let x=new THREE.Vector3().crossVectors(u,f);if(x.lengthSq()<1e-6)x.set(1,0,0);x.normalize();
  const z=new THREE.Vector3().crossVectors(x,u).normalize();return{x,y:u.clone(),z};}

const M={
  pelvis:ell(mat),waist:cyl(.095,.11,mat),chest:ell(mat),neck:cyl(.042,.038,mat),head:ell(mat),nose:sph(.02,matDark),
  bustL:sph(.048,matL),bustR:sph(.048,mat),hair:ell(matHair),bun:sph(.055,matHair),stick:cyl(.009,.009,matStick),
  shL:sph(.055,matL),shR:sph(.055,mat),uaL:cyl(.05,.04,matL),uaR:cyl(.05,.04,mat),elL:sph(.04,matL),elR:sph(.04,mat),
  faL:cyl(.038,.03,matL),faR:cyl(.038,.03,mat),hdL:ell(matL),hdR:ell(mat),
  hpL:sph(.07,matL),hpR:sph(.07,mat),thL:cyl(.075,.055,matL),thR:cyl(.075,.055,mat),knL:sph(.052,matL),knR:sph(.052,mat),
  shnL:cyl(.05,.037,matL),shnR:cyl(.05,.037,mat),anL:sph(.036,matL),anR:sph(.036,mat),ftL:ell(matL),ftR:ell(mat)
};
const target=new THREE.Vector3();let camDist=4;

function update3D(){
  const P=lift(),v=a=>new THREE.Vector3(a[0],a[1],a[2]);
  const fem=S.body==='kadin',th=S.thin,thB=.55+.45*th,tf=LEN.neck/BASE.neck,sl=S.slouch*Math.PI/180;
  const pel=v(P.pelvis),nk=v(P.neck),hd=v(P.head);
  const up=nk.clone().sub(pel).normalize();
  const hipB=basis(up,new THREE.Vector3(0,0,1));
  const upC=up.clone().applyAxisAngle(hipB.x,sl);
  const chB=basis(upC,hipB.z.clone().applyAxisAngle(upC,S.twist*Math.PI/180));
  const hdS=hd.clone().addScaledVector(chB.z,.13*Math.sin(sl)).addScaledVector(up,-.05*Math.sin(sl));
  const upH=hdS.clone().sub(nk).normalize();
  const hB=basis(upH,chB.z.clone().applyAxisAngle(upH,S.head*Math.PI/180));
  const rel=(a,b)=>v(P[a]).sub(v(P[b]));

  const chestC=nk.clone().addScaledVector(upC,-.2*tf);
  orient(M.pelvis,hipB,pel.clone().addScaledVector(up,.01),(fem?.17:.155)*thB,fem?.12:.11,(fem?.115:.105)*thB);
  place(M.waist,pel.clone().addScaledVector(up,.04),chestC,thB*(fem?.78:1));
  orient(M.chest,chB,chestC,(fem?.145:.17)*thB,(fem?.17:.2)*tf,(fem?.1:.11)*thB);
  place(M.neck,nk.clone().addScaledVector(upC,-.03),hdS.clone().addScaledVector(upH,-.08),th);
  orient(M.head,hB,hdS,.095,.12,.105);
  M.nose.position.copy(hdS).addScaledVector(hB.z,.1).addScaledVector(upH,-.012);

  [M.bustL,M.bustR,M.hair,M.bun,M.stick].forEach(m=>m.visible=fem);
  if(fem){
    [[M.bustL,1],[M.bustR,-1]].forEach(([m,sg])=>{m.position.copy(chestC).addScaledVector(chB.z,.072*thB).addScaledVector(chB.x,.055*thB*sg).addScaledVector(upC,.015*tf);m.scale.setScalar(thB);});
    orient(M.hair,hB,hdS.clone().addScaledVector(hB.z,-.03).addScaledVector(upH,.015),.1,.122,.095);
    const bun=hdS.clone().addScaledVector(upH,.115).addScaledVector(hB.z,-.045);M.bun.position.copy(bun);
    place(M.stick,bun.clone().addScaledVector(hB.x,-.15).addScaledVector(upH,-.01),bun.clone().addScaledVector(hB.x,.15).addScaledVector(upH,.035));
  }

  const arm=(side,sh,ua,el,fa,hn)=>{
    const sg=side==='l'?1:-1;
    const s=nk.clone().addScaledVector(chB.x,(fem?.145:.165)*sg*thB).addScaledVector(upC,-.05);
    const e=s.clone().add(rel(side+'Elbow','neck')),h=e.clone().add(rel(side+'Hand',side+'Elbow'));
    sh.position.copy(s);sh.scale.setScalar(thB);place(ua,s,e,th);el.position.copy(e);el.scale.setScalar(th);place(fa,e,h,th);
    const hb=basis(h.clone().sub(e).normalize(),chB.z);orient(hn,hb,h.clone().addScaledVector(hb.y,.04*S.limb),.034*thB,.07*S.limb,.02*thB);
    return [s,e,h];
  };
  const leg=(side,hp,thg,kn,sn,an,ft)=>{
    const sg=side==='l'?1:-1;
    const hpP=pel.clone().addScaledVector(hipB.x,(fem?.1:.09)*sg*thB).addScaledVector(up,-.05);
    const k=hpP.clone().add(rel(side+'Knee','pelvis')),f=k.clone().add(rel(side+'Foot',side+'Knee'));
    hp.position.copy(hpP);hp.scale.setScalar(thB);place(thg,hpP,k,th);kn.position.copy(k);kn.scale.setScalar(th);place(sn,k,f,th);an.position.copy(f);an.scale.setScalar(th);
    const fz=hipB.z.clone().setY(0);const fb=basis(Y.clone(),fz.lengthSq()>1e-4?fz.normalize():new THREE.Vector3(0,0,1));
    orient(ft,fb,f.clone().addScaledVector(fb.z,.055).add(new THREE.Vector3(0,-.03,0)),.045*thB,.035,.11*(.7+.3*S.limb));
    return [hpP,k,f];
  };
  const pts=[pel,nk,hdS.clone().addScaledVector(upH,fem?.17:.12),
    ...arm('l',M.shL,M.uaL,M.elL,M.faL,M.hdL),...arm('r',M.shR,M.uaR,M.elR,M.faR,M.hdR),
    ...leg('l',M.hpL,M.thL,M.knL,M.shnL,M.anL,M.ftL),...leg('r',M.hpR,M.thR,M.knR,M.shnR,M.anR,M.ftR)];

  const box=new THREE.Box3().setFromPoints(pts);
  const fy=box.min.y-.07;floor.position.y=fy;grid.position.set(pel.x,fy+.001,pel.z);
  box.min.y=fy;box.getCenter(target);
  const sz=box.getSize(new THREE.Vector3()),span=Math.max(sz.x,sz.y,sz.z,1.2);
  camDist=(span*.62)/Math.tan(THREE.MathUtils.degToRad(15))+.4;

  let cx=0,cy=0;ORDER.forEach(j=>{cx+=S.p[j][0];cy+=S.p[j][1];});cx/=ORDER.length;cy/=ORDER.length;
  const ld=new THREE.Vector3(S.light.x-cx,S.light.y-cy,S.light.front?.9:-.9).normalize();
  sun.position.copy(target).addScaledVector(ld,6);sun.target.position.copy(target);
  hemi.intensity=S.amb/100;needs3=true;
}
function placeCamera(){
  const a=THREE.MathUtils.degToRad(S.yaw),b=THREE.MathUtils.degToRad(S.pitch);
  camera.position.set(target.x+Math.sin(a)*Math.cos(b)*camDist,target.y+Math.sin(b)*camDist,target.z+Math.cos(a)*Math.cos(b)*camDist);
  camera.lookAt(target);
}
function size3(){const r=c3.getBoundingClientRect();renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.setSize(r.width,r.height,false);camera.aspect=r.width/Math.max(r.height,1);camera.updateProjectionMatrix();needs3=true;}
let needs3=true;
(function loop(){if(needs3){placeCamera();renderer.render(scene,camera);needs3=false;}requestAnimationFrame(loop);})();

let rot=null;
c3.addEventListener('pointerdown',e=>{c3.setPointerCapture(e.pointerId);rot={x:e.clientX,y:e.clientY,yaw:S.yaw,pitch:S.pitch};});
c3.addEventListener('pointermove',e=>{if(!rot)return;
  S.yaw=((rot.yaw-(e.clientX-rot.x)*.45)%360+360)%360;S.pitch=Math.max(-35,Math.min(85,rot.pitch+(e.clientY-rot.y)*.3));
  setSlider('yaw',S.yaw);setSlider('pitch',S.pitch);markView();needs3=true;});
c3.addEventListener('pointerup',()=>rot=null);c3.addEventListener('pointercancel',()=>rot=null);

/* ---------- kontroller ---------- */
const CTL={yaw:['yaw','o-yaw',v=>Math.round(v)+'°'],pitch:['pitch','o-pitch',v=>Math.round(v)+'°'],amb:['amb','o-amb',v=>Math.round(v)],
  twist:['twist','o-twist',v=>Math.round(v)+'°'],headturn:['head','o-head',v=>Math.round(v)+'°'],slouch:['slouch','o-slouch',v=>Math.round(v)+'°'],
  thin:['thin','o-thin',v=>Math.round(v*100)],limb:['limb','o-limb',v=>v.toFixed(2)+'×']};
function setSlider(id,val){const c=CTL[id],el=document.getElementById(id);
  el.value=(id==='thin'||id==='limb')?Math.round(val*100):Math.round(val);document.getElementById(c[1]).textContent=c[2](val);}
function markView(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',+b.dataset.view===Math.round(S.yaw)&&S.pitch<30));}
Object.keys(CTL).forEach(id=>{
  const el=document.getElementById(id),c=CTL[id];
  el.addEventListener('input',()=>{
    let val=+el.value;if(id==='thin'||id==='limb')val/=100;
    document.getElementById(c[1]).textContent=c[2](val);
    if(id==='limb'){setLimb(val);markStyle(null);redraw();return;}
    if(id==='thin'||id==='slouch')markStyle(null);
    S[c[0]]=val;if(id==='yaw'||id==='pitch'){markView();needs3=true;}else update3D();
  });
});
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{S.yaw=+b.dataset.view;S.pitch=8;setSlider('yaw',S.yaw);setSlider('pitch',8);markView();needs3=true;}));
document.getElementById('top').addEventListener('click',()=>{S.pitch=70;setSlider('pitch',70);markView();needs3=true;});
document.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>applyPreset(b.dataset.preset)));
function setBody(b){S.body=b;document.querySelectorAll('[data-body]').forEach(x=>x.classList.toggle('off',x.dataset.body!==b));update3D();}
document.querySelectorAll('[data-body]').forEach(b=>b.addEventListener('click',()=>setBody(b.dataset.body)));
const nBtn=document.getElementById('normal'),sBtn=document.getElementById('myStyle');
function markStyle(w){nBtn.classList.toggle('off',w!=='normal');sBtn.classList.toggle('off',w!=='suat');}
function setProps(limb,thin,slouch){
  S.thin=thin;S.slouch=slouch;setSlider('thin',thin);setSlider('slouch',slouch);setSlider('limb',limb);setLimb(limb);redraw();
}
sBtn.addEventListener('click',()=>{setProps(1.38,.62,22);markStyle('suat');});
nBtn.addEventListener('click',()=>{setProps(1,1,0);markStyle('normal');});

function redraw(){draw2D();update3D();}
const ro=new ResizeObserver(()=>{size2();size3();redraw();});
ro.observe(c2);ro.observe(c3);
size2();size3();S.body='kadin';applyPreset('ayakta');setBody('kadin');markStyle('normal');markView();
})();
</script>
