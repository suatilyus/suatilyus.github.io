<style>
:root{--ink:#111}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff;color:var(--ink);font-family:"suat-long","Patrick Hand",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
img{display:block;max-width:100%;height:auto}
a{color:inherit;text-decoration:none}
.page{width:min(100%,520px);margin:0 auto;container-type:inline-size;padding:calc(env(safe-area-inset-top) + min(15vw,78px)) min(6vw,31px) min(16vw,83px);display:flex;flex-direction:column;align-items:center}
.amblem{width:80cqw;transition:transform .2s}
.amblem:hover{transform:rotate(-2deg) scale(1.03)}
h1{font-size:11cqw;font-weight:400;letter-spacing:.04em;margin-top:5cqw;line-height:1}
.sub{font-size:5cqw;margin-top:1.5cqw;color:#555;text-align:center}
.divider{width:100%;margin:6cqw 0 5cqw}

.srf{display:block;width:100%;text-align:center;margin:4cqw 0 2cqw;transition:transform .15s}
.srf img{width:92cqw;margin:0 auto;display:block;height:auto}
.srf img.giris,.ar-giris img.giris{width:46cqw;margin-top:3cqw}
.ar-giris{display:block;text-align:center;margin:10cqw auto 6cqw;width:max-content;max-width:100%;transition:transform .15s}
.ar-giris img{display:block;width:80cqw;height:auto;margin:0 auto;transform:translateX(3.5cqw)}
.ar-giris:active{transform:scale(.98)}
.srf p{font-size:5.4cqw;line-height:1.3;margin-top:2cqw}
.srf .go{display:inline-block;margin-top:2.5cqw;font-size:5.6cqw;border-bottom:.6cqw solid var(--ink)}
.srf:hover{transform:rotate(-1deg)}
.srf:active{transform:scale(.98)}

.soon{display:flex;flex-direction:column;gap:7cqw;width:100%;margin-top:6cqw}
.ar-kart{display:block;margin:2cqw 0 6cqw;border:.6cqw solid var(--ink);border-radius:3cqw;padding:5cqw 4cqw;text-align:center;color:var(--ink);text-decoration:none;background:#fff;box-shadow:1.2cqw 1.2cqw 0 var(--ink)}
.ar-kart b{display:block;font-family:"suat-skinny","Patrick Hand",sans-serif;font-weight:400;font-size:8.4cqw;letter-spacing:.03em;line-height:1}
.ar-kart .ar-resim{display:flex;gap:4cqw;justify-content:center;margin:4cqw 0 3cqw}
.ar-kart .ar-resim img{width:24cqw;object-fit:cover;aspect-ratio:3/4.4;border:.6cqw solid var(--ink);border-radius:2cqw;transform:rotate(-3deg)}
.ar-kart .ar-resim img+img{transform:rotate(4deg)}
.ar-kart .ar-resim img+img+img{transform:rotate(-2deg)}
.ar-kart p{margin:0;font-size:4.6cqw}
.ar-kart .go{display:inline-block;margin-top:3cqw;font-size:5cqw;text-decoration:underline}
.box{border:.6cqw solid var(--ink);border-radius:2.4cqw;padding:5cqw 4cqw;text-align:center;color:#999}
.box b{display:block;font-weight:400;font-size:8cqw;letter-spacing:.04em;color:#777}
.box span{display:block;font-size:4.6cqw}
.oyun-kart{display:block;width:100%;margin:0 0 8cqw;border:.7cqw solid var(--ink);border-radius:5cqw;padding:5cqw 4cqw 4.5cqw;text-align:center;color:var(--ink);text-decoration:none;background:#fff;box-shadow:1.4cqw 1.4cqw 0 var(--ink);transform:rotate(-1.2deg);transition:transform .15s}
.oyun-kart:active{transform:rotate(-1.2deg) scale(.97)}
.oyun-kart b{display:block;font-family:"suat-skinny","Patrick Hand",sans-serif;font-weight:400;font-size:10cqw;letter-spacing:.03em;line-height:.95}
.oyun-kart .emo{font-size:9cqw;letter-spacing:2cqw;margin:2cqw 0 1cqw}
.oyun-kart p{margin:0;font-size:4.8cqw}
.oyun-kart .yeni{display:inline-block;margin-top:3cqw;font-family:"suat-skinny",sans-serif;font-size:5.4cqw;background:#479f48;color:#fff;border-radius:99px;padding:1.2cqw 5cqw;border:.6cqw solid var(--ink)}
</style>
</head>
<body>

  <h1>UYGULAMALAR</h1>

  <a class="ar-giris" href="../ar/">
    <img src="../img/ui/ar-canlandir.png" alt="AR ile canlandır. Açmak için dokun" width="1000" height="776">
  </a>

  <a class="oyun-kart" href="tahmin/index.html">
    <b>AKLINDAN TUT MORUK</b>
    <div class="emo" aria-hidden="true">🥄🎸🚲</div>
    <p>bir eşya tut, evet-hayırla bulayım</p>
    <span class="yeni">OYNA</span>
  </a>

  <img class="divider" src="../img/divider.png" alt="" width="1062" height="54">
  <h1 style="font-size:8cqw;margin-top:0">YAPIM AŞAMASINDA</h1>
  <div class="soon">
    <a class="box taped" href="#" data-soon><b>DESEN ATÖLYESİ</b><span>desenler, mock-up'lar</span></a>

  <a class="alt-geri" href="../index.html" aria-label="Geri dön"><img src="../img/ui/geri-tabela.png" alt="Geri" width="800" height="536"></a>
</main>
<script src="../ortak.js?v=2611241350"></script>
</body>
</html>
