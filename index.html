<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>suatilyus — şahsi sayfa</title>
<meta name="description" content="Suatilyus'un şahsi sayfası. Suat Serkan Çelmeli — illüstrasyon, mural ve tasarım, İzmir.">
<meta name="theme-color" content="#ffffff">
<meta property="og:title" content="Hoşgeldin moruk — suatilyus">
<meta property="og:description" content="Suatilyus'un şahsi sayfası: illüstrasyon, uygulamalar, indir-kullan.">
<meta property="og:image" content="https://suatilyus.com/img/og.png">
<meta property="og:url" content="https://suatilyus.com/">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="suatilyus">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ortak.css?v=2611170425">
<style>
:root{--pink:#fd225a;--ink:#111}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:#fff;color:var(--ink);font-family:"suat-long","Patrick Hand",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
img{display:block;max-width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.page{width:min(100%,520px);margin:0 auto;container-type:inline-size;padding:calc(env(safe-area-inset-top) + 17cqw) 0 18cqw;display:flex;flex-direction:column;align-items:center;overflow:hidden}

/* 1 cqw = 11.7px on the 1170px drawing */
.header{width:69.6cqw}
.portrait{width:66.5cqw;margin-top:2.2cqw;animation:float 6s ease-in-out infinite}
.portrait .bubble{position:absolute;inset:0;z-index:2;transform-origin:83% 40%;animation:talk 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-1.2cqw) rotate(-.6deg)}}
@keyframes talk{0%,70%,100%{transform:scale(1) rotate(0)}76%{transform:scale(1.08) rotate(3deg)}82%{transform:scale(.97) rotate(-2deg)}88%{transform:scale(1.02)}}

.row{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;align-content:flex-start;gap:5cqw 4.6cqw;width:94%;margin-top:15.6cqw;min-height:30cqw}
/* buttons added from the panel without a drawing: text in a drawn-style frame */
.btn.txt{display:flex;align-items:center;justify-content:center;min-height:8.2cqw;margin-top:.8cqw;border:.6cqw solid var(--ink);border-radius:1.4cqw;outline:.3cqw solid var(--ink);outline-offset:-1.5cqw;color:var(--ink);font-family:"suat-skinny","Patrick Hand",sans-serif;font-size:4.6cqw;letter-spacing:.04em;text-transform:uppercase;padding:0 2cqw;text-align:center;line-height:1}
.btn.txt:hover{background:#ffd23f}
.btn{width:23.6cqw;background:none;border:0;cursor:pointer;display:block;text-decoration:none;transition:transform .12s}
/* color layer: line art sits on top, colour fades in underneath */
.cz{position:relative}
.cz>img{position:relative}
.cz>img.c{position:absolute;inset:0;width:100%;height:100%;opacity:1}
.cz:hover>img.c,.cz.on>img.c,.cz:focus-within>img.c,.btn:focus-visible>img.c{opacity:1;transition-duration:.15s}
.btn .arrows{position:absolute;z-index:3;width:85%;left:-1%;bottom:96%;opacity:0;pointer-events:none;transition:opacity .15s}
.btn:hover .arrows,.btn:focus-visible .arrows,.btn.on .arrows{opacity:1;transition-duration:.15s;animation:poke .6s ease-in-out infinite alternate}
.btn:active{transform:scale(.95)}
@keyframes poke{to{transform:translateY(1cqw)}}

.divider{width:90.8cqw;margin-top:8.5cqw}
.note-header{width:68.5cqw;margin-top:4.4cqw}
/* clipboard note form — hotspots measured on the drawing */
.note{position:relative;width:66cqw;margin-top:2cqw}
.note>img{display:block;width:100%;height:auto}
.note textarea,.note input{position:absolute;z-index:2;background:transparent;border:0;outline:0;resize:none;font:inherit;color:var(--ink);font-size:4.2cqw;line-height:5cqw;padding:0}
.note textarea{left:10.7%;right:11.9%;top:20.5%;height:10.6%}
.note input{left:46.5%;right:10%;top:42%;height:5.4%}
.note textarea::placeholder,.note input::placeholder{color:#9a9a9a}
.note .send{position:absolute;z-index:2;left:45.5%;width:43.2%;top:75.3%;height:13.8%;background:none;border:0;cursor:pointer;border-radius:2cqw;transition:transform .12s}
.note .send:hover{transform:rotate(-3deg) scale(1.04);background:rgba(255,255,255,.12)}
.note .send:active{transform:scale(.94)}
/* approved notes, pinned with different coloured pins */
.notlar{width:92cqw;margin-top:10cqw}
.notlar h2{font-size:7cqw;font-weight:400;letter-spacing:.04em;text-align:center;margin-bottom:5cqw}
.ntl{display:grid;grid-template-columns:1fr 1fr;gap:6cqw 4cqw;align-items:start}
.nt{position:relative;background:center/100% 100% no-repeat;min-height:31cqw;padding:9.5cqw 4.5cqw 4cqw;font-size:4cqw;line-height:1.3;white-space:pre-wrap;word-break:break-word;filter:drop-shadow(0 .6cqw 0 rgba(0,0,0,.08))}
.nt small{display:block;margin-top:1.4cqw;font-size:3.2cqw;color:#7a5a12}
.nt.tek{grid-column:1/-1;width:62%;justify-self:center}
.divider2{margin-top:14.5cqw}
.soon{width:39.3cqw;margin-top:2.5cqw;animation:wobble 3s ease-in-out infinite}
@keyframes wobble{50%{transform:rotate(-2.5deg) scale(1.03)}}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main class="page">
  <h1 class="sr">Hoşgeldin moruk — Suatilyus'un şahsi sayfası</h1>
  <div class="header cz"><img class="c" src="img/header-c.png" alt=""><img src="img/header.png" alt="Hoşgeldin moruk · Suatilyus'un şahsi sayfası · V-01" width="814" height="215"></div>

  <div class="portrait cz">
    <img class="c" src="img/portrait-c.png" alt="">
    <img src="img/portrait.png" alt="Şapkalı, uzun saçlı ve sakallı karakter" width="778" height="633">
    <img class="bubble" src="img/bubble.png" alt="N'aber?" width="778" height="633">
  </div>

  <nav class="row" id="btns" aria-label="Ana menü"></nav>

  <div class="divider cz"><img class="c" src="img/divider-c.png" alt=""><img src="img/divider.png" alt="" width="1062" height="54"></div>
  <div class="note-header cz"><img class="c" src="img/note-header-c.png" alt=""><img src="img/note-header.png" alt="Gitmeden not bırak" width="802" height="152"></div>
  <form class="note" id="note">
    <img src="img/ui/pano.png" alt="Yaz moruk…" width="607" height="968">
    <textarea name="not" maxlength="1000" aria-label="Notun" placeholder="yaz bakalım… "></textarea>
    <input name="kim" maxlength="60" aria-label="Instagram adın (mecburi değil)" placeholder="instagram (mecburi değil)" autocomplete="off">
    <button class="send" type="submit" aria-label="Gönder"></button>
  </form>

  <section class="notlar" id="notlar" hidden aria-label="Bırakılan notlar"><h2>BIRAKILAN NOTLAR</h2><div class="ntl" id="ntList"></div></section>
  <div class="divider divider2 cz" id="uygulamalar"><img class="c" src="img/divider-c.png" alt=""><img src="img/divider.png" alt="" width="1062" height="54"></div>
  <img class="soon" src="img/cok-yakinda.png" alt="Çok yakında: suatilyus app!" width="460" height="313">
</main>
<script src="ortak.js?v=2611170425"></script>
<script>
/* home buttons come from veri/site.json (control panel) */
suat.veri().then(d=>{
  const E=suat.esc;
  document.getElementById('btns').innerHTML=d.butonlar.filter(b=>!b.gizli).map(b=>{
    const ext=/^https?:/.test(b.link), href=b.link?suat.url(b.link):'#';
    const attrs=`href="${E(href)}"${ext?' target="_blank" rel="noopener"':''}${b.link?'':' data-soon'}`;
    return b.gorsel
      ? `<a class="btn cz" ${attrs}>${b.renk?`<img class="c" src="${E(suat.url(b.renk))}" alt="">`:''}<img src="${E(suat.url(b.gorsel))}" alt="${E(b.ad)}"><img class="arrows" src="img/arrows.png" alt=""></a>`
      : `<a class="btn txt" ${attrs}>${E(b.ad)}</a>`;
  }).join('');
});
const say=(m,ok)=>suat.toast(m,ok);
let KUTU=null;
suat.veri().then(d=>{
  KUTU=d.notKutusu||null;
  const N=(d.notlar||[]);
  if(N.length){document.getElementById('notlar').hidden=false;
    const PIN=['kirmizi','mavi','yesil','pembe','mor','siyah'];
    document.getElementById('ntList').innerHTML=N.map((n,i)=>{const rot=((i*37)%7-3)*0.7;
      return `<div class="nt${N.length%2&&i===N.length-1?' tek':''}" style="background-image:url(img/ui/not-kart-${PIN[i%PIN.length]}.png);transform:rotate(${rot}deg)">${suat.esc(n.metin)}<small>${n.kim?'@'+suat.esc(n.kim.replace(/^@/,''))+' · ':''}${suat.esc(n.tarih||'')}</small></div>`}).join('');}
});
document.getElementById('note').addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target,m=f.not.value.trim();
  if(!m){say('önce bi şey yaz moruk');f.not.focus();return}
  if(!KUTU||!KUTU.form||!KUTU.alan){say('not kutusu çok yakında açılıyor',true);return}
  try{const fd=new FormData();const k=f.kim.value.trim();fd.append(KUTU.alan,k?m+'\n— @'+k.replace(/^@/,''):m);
    await fetch(KUTU.form,{method:'POST',mode:'no-cors',body:fd});
    f.reset();say('aldım, okuyunca asarım',true);
  }catch(err){say('gitmedi, bi daha dene')}
});
</script>
</body>
</html>
